syntax = "proto3";
package std;

option csharp_namespace = "art.media.platform.std";
option go_package = "github.com/art-media-platform/amp.SDK/amp/std";

import "amp/amp.core.proto";
import "google/protobuf/descriptor.proto";

// TRS_Flags selects special placement behavior for a TRS.
enum TRS_Flags {
    FixedScale = 0;
    AutoScale  = 1;  // Dynamically adjust scale based on observer position.
}


// TRS (Translate, Rotate, Scale) is a general-purpose placement: time, space,
// orientation, and/or geo-position.
message TRS {

    // Uniform spatial scale; if 0, scale is implicitly 1.0
    double              Sx = 1;

    // Special TRS behavior
    TRS_Flags           Flags = 2;

    // Spatial position
    double              Px = 3;
    double              Py = 4;
    double              Pz = 5;

    // Spatial rotation; if all values 0, Quaternion is unit identity
    double              Qx = 10;
    double              Qy = 11;
    double              Qz = 12;
    double              Qw = 13;

    // Optional S2 tiles
    fixed64             S2_0 = 14;
    fixed64             S2_1 = 15;
}

// Matrix4x4 is a double-precision 4x4 transform.
message Matrix4x4 {

    // 16 doubles in row-major order
    double M00 = 1;
    double M01 = 2;
    double M02 = 3;
    double M03 = 4;

    double M10 = 5;
    double M11 = 6;
    double M12 = 7;
    double M13 = 8;

    double M20 = 9;
    double M21 = 10;
    double M22 = 11;
    double M23 = 12;

    double M30 = 13;
    double M31 = 14;
    double M32 = 15;
    double M33 = 16;

}

// Camera framing mode ladder; 0 denotes unset.
enum CameraModeID {
    CameraModeUnset   = 0;
    FirstPerson       = 1; // eye-level inside / on the target
    ThirdPersonFollow = 2; // chase relation behind the target
    ThirdPersonOmni   = 3; // wide target-aware view
    Orbital           = 4; // sphere-anchored orbit
    Omniscient        = 5; // god-view; target optional
    Ortho             = 6; // top-down planar
    Driver            = 7; // first-person from inside vehicle
    Chase             = 8; // third-person follow at heading
    Free              = 9; // gesture-only; no rig framing
}

// General purpose Camera state
message CameraState {
    TRS    Placement = 1;
    float  Pitch     = 2; // degrees
    float  Yaw       = 3; // degrees
    float  Distance  = 5; // optional distance to anchor
    float  Altitude  = 6; // optional altitude above the surface
    float  Mass      = 9; // optional mass (inertia) of camera body


    float  NearPlane = 10; // optional near plane distance
    float  FarPlane  = 11; // optional far plane distance
    float  Fov       = 13; // field of view in degrees; 0 denotes orthographic camera
    int32  PixelsX   = 16; // viewport width in pixels
    int32  PixelsY   = 17; // viewport height in pixels

    string Mode      = 20; // optional camera mode label; ModeID is authoritative when set

    CameraModeID ModeID = 21;
}

// CameraOptions carries a viewer's camera preferences — how the camera should
// behave, as opposed to CameraState, which is where the camera currently is.
message CameraOptions {
    float  MoveSpeed   = 1; // movement speed multiplier
    string Mode        = 2; // e.g. "orbit", "first-person", "flight", etc.
    string ModeTags    = 3; // e.g. "hide-altitude.present-fullscreen"
    int32  ShowUnits   = 4; // level of detail
}


// FileInfo is a general-purpose file system meta info block.
message FileInfo {
    string Mode        = 1; // unix file mode label
    bool   IsDir       = 2; // true if item is a directory

    string DirName     = 4; // prepended to FileName forms full path
    string ItemName    = 5; // file/dir item name
    int32  ExtLen      = 6; // length of the file extension (0 if none)
    string ContentType = 8; // MIME type of the file (e.g. "image/png", "text/html")

    int64  CreatedAt   = 10; // UTC << 16
    int64  ModifiedAt  = 11; // UTC << 16
    int64  ByteSize    = 14; // data fork byte length
}


// ValueKind specifies the primary type of a JsonValue.
enum ValueKind {
    Null   = 0;
    False  = 1;
    True   = 2;
    Number = 3;
    String = 4;
    Array  = 5;
}

// JsonValue is a general-purpose JSON value container.
// Though multiple fields may be set (e.g. a Number also encoded as a string),
// the Kind field declares which is the primary source of truth.
message JsonValue {
    ValueKind          Kind   = 1;
    string             String = 2;
    double             Number = 3;
    repeated JsonValue Array  = 4;
}

// Generic report summary
message Report {
    amp.Tag Title   = 1; // label — the report headline (TagText leaf)
    amp.Tag Caption = 2; // label — one-line subtitle

    repeated amp.Tag Errors   = 3; // label — one error line per leaf
    repeated amp.Tag Warnings = 4; // label — one warning line per leaf
    repeated amp.Tag Messages = 5; // label — one status/progress line per leaf
    repeated amp.Tag Debug    = 15; // label — one diagnostic line per leaf
}

// Labels is the bundled label struct for "described items" — media tracks,
// catalog entries, planet-level items, anything with a name + a 1-line
// subtitle + an optional grouping name + an optional long-form description.
//
// Use std.Attr.ItemLabels (this struct, flat per-item) for self-described
// items.  Use std.Attr.SeriesLabels (series of these structs keyed by item ID)
// when a parent channel maintains a series of described children.
//
// For raw single-text containers (messages, plain notes) prefer dedicated
// text attrs instead of Labels.
message Labels {
    string        Title       = 1;  // primary name
    string        Caption     = 2;  // 1-line subtitle (e.g. artist line)
    string        Collection  = 3;  // grouping label (e.g. album / playlist)
    string        About       = 4;  // long-form description / synopsis
}

// ModuleRef is the wire / attr-value descriptor of one app module: its
// identity, human presentation, and maturity.  It is the serializable
// projection of an in-process amp.AppModuleInfo (see std.NewModuleRef) for
// app-listing / about surfaces and as a software-bill-of-materials row (one per
// installed module).
message ModuleRef {
    amp.Tag  Module  = 1; // the module this describes (its invocation tag)
    Labels   Labels  = 2; // Title (name), Caption (1-line), About (detail)
    amp.Tags Tags    = 3; // glyph variant tree (size / theme / density)
    string   Version = 4; // maturity "v{TRL}[.{minor}]"; see TRL-versioning.md
}

// Rect is a lightweight set of geo tiles forming a rectangle, composed from a
// center plus width/height.  The units are typically mid H3 resolution, with
// rectangular dimensions in units of font glyph size.
message Rect {

    PointFormat Format = 1; // specifies the type and format of Coords
    fixed64     Anchor = 2; // S2 or H3 tile index; also implies visual
    fixed64     R      = 3; // mm altitude from globe center or UTC64

    int32       Width  = 8; // mm
    int32       Height = 9; // mm

    int32       I = 10; // center offset
    int32       J = 11; // center offset
    int32       K = 12; // center offset
}




// General purpose polygonal path of geo tiles.
message GeoPath {

    enum RenderType {
        Point = 0;
        Path  = 1;
        Ring  = 2;
    }

    RenderType Type      = 1;
    float      ExtrudeLo = 4;  // if non-zero, the extrusion's lower bound
    float      ExtrudeHi = 5;  // if non-zero, the extrusion's upper bound

    PointFormat      Format = 14; // specifies the type and format of Coords
    repeated fixed64 Points = 15; // tile indices interleaved with associated UTC64 or Rmm based on Format.

}


// PointFormat declares how a packed sequence of tile indices is encoded — which
// grid (S2 or H3) and whether each point carries a trailing time component.
enum PointFormat {
    S2  = 0; // (S2)      (1) uint64: lat,lng, (res)
    H3  = 1; // (H3)      (1) uint64: lat,lng, (res)
    S2T = 2; // (S2, T)   (2) uint64: lat,lng, (res), UTC64
    H3T = 3; // (H3, T)   (2) uint64: lat,lng, (res), UTC64
}


// MediaInfo wraps a media track, feature, featurette, collection, album, or
// playlist.
message MediaInfo {
    MediaFlags Flags      = 1; // describes this item
    amp.Tag    Tag        = 3; // unused — no producer; field number held until a role is ruled at first use
    double     StartAt    = 5; // starts playback at the given seconds offset
    double     Seconds    = 6; // playback duration in seconds

    float      Popularity = 16; // 0.0 to 1.0

    // Unused — order lives in item.MediaRank (AOM AD-playlists.md §3); field
    // number held until re-genesis.
    float      Ordering   = 17;
}


// MediaFlags describes what a media item is and what it supports.
enum MediaFlags {
    NoMedia             = 0;

    IsLive              = 0x0001;
    IsSeekable          = 0x0002;
    IsUnending          = 0x0004;
    NewChapter          = 0x0008;
    NewTrack            = 0x0010;

    HasAudio            = 0x0100;
    HasVideo            = 0x0200;
    HasSpeech           = 0x0400;
    NeedsNetwork        = 0x0800;

    // When set, the user is more likely to skip short intervals than to switch
    // media items.
    SkipIsLikely        = 0x01000000;

}

// MediaTags is what the audio says about itself, on a TRACK node
// (item.MediaTags).  Labels is DERIVED from this, never the reverse — a
// display line is not a data source (AOM AD-playlists.md §2).
message MediaTags {
    string Title       = 1;
    string Artist      = 2;
    string AlbumArtist = 3;
    string Album       = 4;
    string Genre       = 5;
    string Date        = 6;  // ISO-8601 (ID3 TDRC)

    int32  TrackNumber = 7;
    int32  TrackTotal  = 8;
    int32  DiscNumber  = 9;
    int32  DiscTotal   = 10;

    string Composer    = 11;
    string Publisher   = 12;
    string ISRC        = 13;
    string Comment     = 14;

    // Everything else, including unknown ID3 frames — lossless round-trip.
    repeated MediaTag Extra = 20;
}

// MediaTag is one named media field — the ID3 frame, generalized.
message MediaTag {
    string    Name  = 1; // "TXXX:REPLAYGAIN_TRACK_GAIN", "MUSICBRAINZ_ALBUMID"
    string    Text  = 2;
    int64     I     = 3; // value (track 3 of 12; BPM)
    int64     J     = 4; // total
    amp.Units Units = 5;
    string    Lang  = 6; // BCP-47 (ID3 COMM / USLT)
    bytes     Data  = 7; // opaque payload, so a round-trip is lossless
}

// MediaEntry is one playlist row, keyed by entryID on the PLAYLIST node
// (item.MediaEntry).  A row renders with no other cell loaded.  Ref decides
// whether the row is a cache or the authority: a track NodeID projects that
// node (N rows render from one pin, zero fanout); a blob asset UID or a URI
// means there is no track node and these fields ARE the only metadata.
message MediaEntry {
    amp.Tag   Ref    = 1; // track NodeID | blob asset UID | URI
    Labels    Labels = 2;
    MediaInfo Info   = 3; // Seconds, Flags, StartAt
    amp.Tags  Cover  = 4; // glyph variant tree
}

// MediaRank is a playlist row's position, keyed by entryID on the PLAYLIST node
// (item.MediaRank) — its own cell, so a reorder and a metadata refresh never
// collide (AOM AD-playlists.md §4).  The rank is a fractional-index UID minted
// by tag.RankBetween / tag.RanksAcross; render order is (Rank, entryID).
// Absent => order by entryID; a single interactive append writes none.
message MediaRank {
    fixed64 Rank_0 = 1;
    fixed64 Rank_1 = 2;
}

// Segment is one unit of content: an inline on-chain copy of the bytes and/or a
// reference to the durable content-addressed blob.  The timeline fields are
// optional — zero for an atomic asset (a file, an image, a portal template),
// set for a slice of a live or recorded stream.  When timed, playback time is
// the exact integer rational TickDelta / TickRate (the QuickTime time model),
// so consecutive segments tile a stream exactly: TickOffset + TickDelta == the
// next segment's TickOffset.  For a byte-rate stream the natural tick is the
// byte.
message Segment {
    int64       TickOffset  = 1; // cumulative tick offset of this segment's start on the stream timeline (0 if untimed)
    int64       TickDelta   = 2; // this segment's duration as an exact tick span (0 if untimed)
    int64       TickRate    = 3; // ticks per second — the timescale (0 when the source rate is unknown)
    amp.Units   Units       = 4; // what one tick is (Bytes for a byte-stream; Samples / Seconds for sampled media)
    string      ContentType = 5; // content (MIME) type of the bytes
    bytes       Inline      = 6; // inline on-chain copy of the bytes (integrity-check / live-edge); empty for blob-only
    amp.BlobRef Blob        = 7; // the durable content-addressed bytes; nil for inline-only
}

// Arg is an any-purpose key/value pair.
message Arg {
    string    Key   = 1;
    JsonValue Value = 2;
}

// ColormapFlags selects which color channels a visual layer drives.
enum ColormapFlags {
    ColormapFlags_None = 0;
    ColormapFlags_Full = 0x01;
    ColormapFlags_Back = 0x02;
    ColormapFlags_Fore = 0x04;
}

// SensorFlags selects which device sensor inputs a visual layer consumes.
enum SensorFlags {
    SensorFlags_None    = 0;
    SensorFlags_GyroUp  = 0x01;
}

// AudioFlags selects which audio-analysis inputs a visual layer consumes.
enum AudioFlags {
    AudioFlags_None     = 0;
    AudioFlags_FFT      = 0x01;
}

// VisPreset is one named visual-layer preset: its presentation labels, the
// input axes it consumes, its aspect-ratio pegs, its seed, and the layer asset
// it drives.  Seed is each load's seed for a VisShader layer's draws (the vis
// library's seed word, iRandUniform, the frame randoms) and for Mandelbulb's
// species, palette and flight; an engine with randomness of its own (G-Force,
// VisPlexus, SwarmVis) does not take it yet.  A positive Seed is a hand seed:
// every load replays the same draws.  Otherwise Seed names how each load's seed
// is chosen (std.Vis, amp.std.consts.sdl): Vis.SeedEachLoad, the default, rolls
// fresh at every load; Vis.SeedPlaylistPosition takes the vis's position in the
// playlist it plays from; Vis.SeedNode takes the node's ItemID.  An undefined
// negative rolls fresh.
message VisPreset {
    amp.Tag         Title       = 1; // label — preset display name
    amp.Tag         Collection  = 2; // label — the pack/collection the preset ships in
    amp.Tag         Credits     = 3; // label — author / attribution line

    ColormapFlags   ColormapFlags = 6;
    SensorFlags     SensorFlags   = 7;
    AudioFlags      AudioFlags    = 8;

    float           AspectMin = 10; // y/x lower peg; 0 denotes no min
    float           AspectMax = 11; // y/x upper peg; 0 denotes no max

    int64           Seed = 12; // > 0 a hand seed; else a Vis.Seed* sentinel (above)

    string          AssetURI = 20; // VisualLayer asset URI (VisShader / VisPlexus / GForce / …)
    repeated Arg    Args     = 21; // free use arguments passed to the asset
}


// TileEase controls how a TileBand's profile transitions from its inner to
// outer radius.
enum TileEase {
    TileEase_Linear   = 0;
    TileEase_Circular = 1;   // 90-degree arc, normals trending up
    TileEase_Cubic    = 2;
}

// TileBand is the profile of one beveled ring of a tiled polygon mesh — the
// shareable, data form of the Unity authoring struct.  Bands stack
// back-to-front in array order.  +X is 3 o'clock on the tile, +Y is up
// (outward), +Z is 12 o'clock.
message TileBand {
    string          Label          = 1;    // authoring label (cosmetic)
    bool            Enabled        = 2;
    float           AlphaMin       = 3;     // transparency range (propagates to position.w)
    float           AlphaMax       = 4;
    float           RadiusMin      = 5;     // ring radius range from tile center (1 = polygon edge)
    float           RadiusMax      = 6;
    float           YMin           = 7;     // altitude range above the tile plane (y=0)
    float           YMax           = 8;
    TileEase        YEase          = 9;     // inner→outer thickness transition
    int32           RadialSegments = 10;    // radial sections from RadiusMin to RadiusMax
    int32           EdgeSections   = 11;    // sections per polygon edge (excluding corners)
    int32           SegmentsPer360 = 12;    // corner sections per 360 degrees
    float           CornerRadius   = 13;    // corner bevel radius (0 = sharp)
    bool            Underside      = 14;    // band forms the tile underside (flips normals)
    float           TextureOffsetX = 15;
    float           TextureOffsetY = 16;
    float           TextureOffsetZ = 17;
    float           TextureOffsetW = 18;
    float           TextureScaleX  = 19;
    float           TextureScaleY  = 20;
    float           TextureScaleZ  = 21;
    float           TextureScaleW  = 22;
}

// TileMeshSpec is a procedural tile-mesh recipe: a polygon swept into beveled
// bands.  The geometry-side analog of VisPreset; consumed by the runtime tile
// mesher.
message TileMeshSpec {
    repeated TileBand   Bands         = 1;
    float               Thickness     = 2;  // thickness as a ratio of the tile's smaller dimension
    int32               Sides         = 3;  // polygon sides (e.g. 0, 6 = pointy-top hex)
    float               Rotate        = 4;  // degrees to rotate the base polygon about up (e.g. 30 = flat-top hex)
}

// SkinSpec is the shareable unit of a visual mod: a geometry source composed
// with an ordered stack of VisualLayers (skins / effects).  Geometry is
// TileMesh (procedural recipe) when its Bands are set, else the built asset at
// MeshAssetURI.  Layers apply back-to-front; each VisPreset.AssetURI names a
// VisualLayer (VisShader / VisPlexus / GForce / …).
message SkinSpec {
    string              MeshAssetURI = 1;   // built mesh / Model / VisualScope prototype
    TileMeshSpec        TileMesh     = 2;   // OR a procedural tile recipe (precedence when Bands set)
    repeated VisPreset  Layers       = 3;   // ordered VisualLayers
}

// AtmosphereEffect is one tagged entry in an AtmosphereSpec.  Label identifies
// the category the entry contributes to (Sky / Sun / Night / Fog — see
// std.Atmosphere.Label* for canonical strings); URI selects the variant within
// that category.
//
// URI semantics, when Enabled = true:
//   non-empty → the named effect asset (resolved via AssetRequest / built-in switch)
//   empty     → use the category default (std.Atmosphere.SkyEarth / SunStandard / ...)
// Enabled = false disables the effect entirely; URI is retained so toggling on
// restores the previous selection without round-trip loss.
message AtmosphereEffect {
    string Label   = 1;   // category id; canonical values in std.Atmosphere.Label*
    string URI     = 2;   // effect asset URI; empty + Enabled = true → category default
    bool   Enabled = 3;   // off-switch independent of URI presence
}

// AtmosphereSpec composes a mantle's atmosphere from tagged effect entries.
// Each category (Sky / Sun / Night / Fog) is independently overridable; a
// planet author can ship a partial set and inherit the rest.  Multiple entries
// with the same Label are reserved for future stacking (e.g., two compatible
// Sky layers); the renderer honors the first entry per category.
//
// Category functional split:
//   Sky — the always-on base aesthetic (zenith / horizon shell, limb sheen at the edge).
//   Sun — time-of-day phenomena that get in the way of legibility during map work
//         (sunset glow, terminator color, Henyey-Greenstein forward scatter).
//   Night — night-side dim and cool tinting; off → uniform daylight everywhere.
//   Fog — exponential aerial perspective on tiles; hides distant tile edges.  Usually on.
message AtmosphereSpec {
    repeated AtmosphereEffect Effects = 1;
}


// TileServerKind narrows what a tile backend serves so consumers can compose
// stacks (base imagery + labels + hillshade + weather + terrain) without
// guessing from URL strings.
enum TileServerKind {
    TileServerKind_Unspecified      = 0;
    TileServerKind_RasterImagery    = 1;   // base map raster (e.g. OSM, satellite)
    TileServerKind_RasterLabels     = 2;   // labels-only overlay
    TileServerKind_RasterHillshade  = 3;   // hillshade overlay
    TileServerKind_RasterContours   = 4;   // contour-line overlay
    TileServerKind_RasterWeather    = 5;   // radar / clouds / precipitation
    TileServerKind_RasterTerrainRGB = 10;  // elevation encoded into RGB (Mapbox, Terrarium)
    TileServerKind_TerrainQuantized = 11;  // Cesium quantized-mesh terrain
    TileServerKind_VectorMVT        = 20;  // Mapbox Vector Tiles
}

// TileProjection identifies the cartographic projection of the tile pyramid.
enum TileProjection {
    TileProjection_Unspecified = 0;
    TileProjection_WebMercator = 1;  // EPSG:3857 — universal slippy raster
    TileProjection_Geodetic    = 2;  // EPSG:4326 (lat/lng equirect)
}

// TileServerScheme identifies the (z, x, y) tile addressing convention.
enum TileServerScheme {
    TileServerScheme_Unspecified = 0;
    TileServerScheme_XYZ_Slippy  = 1;  // {z}/{x}/{y}, Y from north (slippy / OSM)
    TileServerScheme_TMS         = 2;  // {z}/{x}/{y}, Y from south (TMS)
    TileServerScheme_QuadKey     = 3;  // Bing-style quadkey
}

// TileServerAuth describes how a per-tile API key is delivered.
enum TileServerAuth {
    TileServerAuth_None      = 0;
    TileServerAuth_QueryKey  = 1;  // appended as ?<APIKeyToken>=<key>
    TileServerAuth_HeaderKey = 2;  // sent in <AuthHeader>
    TileServerAuth_Cookie    = 3;
}

// TileServer describes a Web-Mercator (or projection-tagged) tile backend.
// Consumers (TileService and friends) use this exclusively — no provider
// strings, no hard-coded catalogs, no custom code per provider.  Stored
// as repeated items under std.Attr.TileServer; channel selectors filter
// by Kind / Projection / region tags.
message TileServer {

    // Stable identifier (e.g. "osm", "mapbox.streets", "stamen.toner").
    string              ID            = 1;

    // Human-readable display name.
    string              Name          = 2;

    // Attribution string shown on the rendered map per provider terms.
    string              Attribution   = 3;

    // What this backend serves — drives stack composition + shader pick.
    TileServerKind      Kind          = 4;

    // Projection of the tile pyramid (almost always WebMercator).
    TileProjection      Projection    = 5;

    // Y-axis convention + addressing scheme.
    TileServerScheme    Scheme        = 6;

    // URL template; supports {z} {x} {y} {s} {access_token} {key}
    // e.g. "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
    string              URLTemplate   = 10;

    // Subdomains for {s} substitution (e.g. ["a","b","c"]).
    repeated string     Subdomains    = 11;

    // Name of the auth-token placeholder in URLTemplate (e.g. "access_token"
    // for "...?{access_token}").  Empty for no-auth providers.
    string              APIKeyToken   = 12;

    // How the API key is delivered.
    TileServerAuth      AuthMethod    = 13;

    // Header name when AuthMethod = HeaderKey (e.g. "Authorization",
    // "X-API-Key").
    string              AuthHeader    = 14;

    // Zoom range supported by the provider.
    int32               MinZoom       = 20;
    int32               MaxZoom       = 21;

    // Tile pixel dimension (typically 256 or 512).  0 = unspecified, treat as
    // 256.
    int32               TileSizePx    = 22;

    // Per-host minimum interval between requests (provider politeness hint).
    // 0 = unspecified.  OSM ≈ 500.
    int32               MinIntervalMs = 23;

    // MIME content type of returned tiles ("image/png", "image/jpeg",
    // "application/x-protobuf").
    string              ContentType   = 30;

    // For terrain kinds, the elevation encoding scheme ("mapbox-rgb",
    // "terrarium").
    string              ElevationEncoding = 31;

}


// Reticle style ladder for the space-channel center reticle; 0 denotes unset.
enum ReticleStyleID {
    ReticleStyleUnset   = 0;
    ReticleLine         = 1;
    ReticleAngleBracket = 2;
    ReticleSideBrackets = 3;
}

// DeviceVars is the device-class client vars group — settings tied to one
// device's display, audio output and performance envelope.  Stored as one
// item on the member's device node in the home planet (std.Attr.HomeDeviceVars).
// A zero field is the "unset" sentinel; resolution happens at point of use
// (each field states its rule), never in a field initializer.
message DeviceVars {
    float UIScale   = 1; // item size scale; 0 → derived from display DPI
    int32 TargetFPS = 2 [(Control) = {   // target frame rate, one of the Choices (the frame regulator's steps at 60 Hz); 0 → (Control).Default
        ValueID: "frame.target.fps"
        Labels:  {Title: "Target FPS"}
        Kind:    ControlKind_Choice
        Range:   {Min: 15 Max: 60 Step: 1 Units: FramesPerSecond}
        Default: {Kind: Number Number: 60}
        Choices: [
            {Labels: {Title: "60 fps"} Value: {Kind: Number Number: 60}},
            {Labels: {Title: "30 fps"} Value: {Kind: Number Number: 30}},
            {Labels: {Title: "20 fps"} Value: {Kind: Number Number: 20}},
            {Labels: {Title: "15 fps"} Value: {Kind: Number Number: 15}}
        ]
        Layers:  [SettingLayer_Channel, SettingLayer_Device]
    }];
    // output latency: how long this device's output route and speaker take
    // past FMOD's mixer; the vis delay is the mixer's measured lead plus this
    int32 AudioLatencyMS = 3 [(Control) = {   // ms; 0 → (Control).Default
        ValueID: "audio.latency"
        Labels:  {Title: "A/V Latency"}
        Range:   {Min: 5 Max: 500 Step: 5 Units: Milliseconds}
        Default: {Kind: Number Number: 60}
        Layers:  [SettingLayer_Device]
    }];
}

// MemberVars is the member-class client vars group — presentation preferences
// that follow the member across devices.  Stored as one item on the home
// planet head node (std.Attr.HomeMemberVars).  Zero/empty fields are "unset"
// and resolve at point of use.
message MemberVars {
    // The member's fallback space skybox asset URI: a channel's own skybox
    // (std.Attr.ChannelPropertySkybox) wins over it; empty → no fallback.
    string         DefaultSkyboxURI  = 1;
    ReticleStyleID ReticleStyle      = 2; // center reticle style; 0 → ReticleLine
    string         ReticleOverlayURI = 3; // center reticle overlay sprite URI; empty → overlay hidden
    float          VJDwellSecs       = 4; // seconds each vis holds in the player's vis walk; 0 → std.VJ.DefaultDwellSecs
}

// ─── Settings controls: definitions a menu, a web card or a script renders ───

// FieldAccess says whether a control may change a value; the strictest of a
// ControlSpec's and its layers' policies wins.  A value a client does not
// know reads as read-only.
enum FieldAccess {
    FieldAccess_Editable     = 0;
    FieldAccess_Immutable    = 1; // a founding fact, e.g. PlanetCharter.Declaration
    FieldAccess_Generated    = 2; // computed or written by the host
    FieldAccess_Locked       = 3; // held by a brand, template or license tier; the value resolves at the locking layer
    FieldAccess_Unauthorized = 4; // the viewer has no write authority
    FieldAccess_Hidden       = 5; // a brand or license tier removes the setting; no cell is drawn
}

enum RangeScale {
    RangeScale_Linear = 0;
    RangeScale_Log    = 1; // a tick multiplies by a constant ratio; Step still snaps
}

enum RangeFormat {
    RangeFormat_Number   = 0; // shown to Step's precision
    RangeFormat_Duration = 1; // [h[h:[m]]]m:ss
}

// FieldRange is a number's control range.  Min < Max bounds the value (an
// infinite end leaves that side open); otherwise the value is unbounded.
message FieldRange {
    double      Min       = 1;
    double      Max       = 2;
    double      Step      = 3; // 0 = continuous: one tick = 1/90 of the span
    RangeScale  Scale     = 4;
    RangeFormat Format    = 5;
    amp.Units   Units     = 6; // what the number measures
    string      UnitLabel = 7; // a display override; empty → the Units symbol
}

// Switch is a boolean setting: 0 is unset, so "no entry" and "off" differ.
enum Switch {
    Switch_Unset = 0;
    Switch_Off   = 1;
    Switch_On    = 2;
}

// ControlKind names a control's interaction under the four verbs and the one
// axis (AOM UD-cmdr-yoke.md §2, §7.4); the look belongs to the skin.
enum ControlKind {
    ControlKind_Nil    = 0;
    ControlKind_Menu   = 1; // a submenu (Children); Enter pushes
    ControlKind_Toggle = 2; // Enter flips
    ControlKind_Number = 3; // Enter captures the axis; ticks step; Enter commits; Back restores
    ControlKind_Choice = 4; // Enter pushes Choices; Enter on one sets it
    ControlKind_Text   = 5; // Enter pushes the editor
    ControlKind_Action = 6; // Enter invokes the handler bound to ActionID
    ControlKind_List   = 7; // an array or repeated field: Children are its elements
}

// SettingLayer names where a setting's value may live, nearest first.
enum SettingLayer {
    SettingLayer_Nil     = 0;
    SettingLayer_Channel = 1; // the playing channel's property: channel.property.<ValueID>
    SettingLayer_Device  = 2; // std.DeviceVars
    SettingLayer_Member  = 3; // std.MemberVars
    SettingLayer_Brand   = 4; // the factory Brand's defaults and locks (reserved)
    SettingLayer_Planet  = 5; // planet-wide, set by its admins (reserved)
    SettingLayer_Local   = 6; // this device only, never synced (reserved)
    SettingLayer_Host    = 7; // a default the host computes, below every stored layer (reserved)
}

message ControlChoice {
    Labels    Labels   = 1;
    JsonValue Value    = 2;
    string    GlyphURI = 3;
}

// A setting's value is a JsonValue:
//   - no entry: null, so the layer below shows through;
//   - explicit none ("None", "Off" over a lower layer's value): Kind Null;
//   - bool: True / False; number: Number; text or URI: String;
//   - enum: String, the value's proto name ("ReticleLine"); an unknown name is refused;
//   - color: String "#RRGGBBAA"; vector: Array of Numbers; UID: String, base32.
//
// A ValueID names the setting itself, the same in every layer; each store
// binds it to its own address (a field whose (Control) option states it, a
// channel property, a document path).  It is a tag expression of dot
// segments ("frame.target.fps", "camera.controls.panSpeed"), compared in its
// canonic form (AOM ZO-design-conventions.md §4.8).
//
// ControlSpec is one control's definition: a cell, or with Children a submenu.
message ControlSpec {
    string                 ValueID    = 1;  // the setting this control shows and edits, e.g. "frame.target.fps"
    string                 ActionID   = 2;  // the act Enter performs: an Action's handler, a Menu's or List's push
    Labels                 Labels     = 3;
    string                 GlyphURI   = 4;  // a theme slot ("sys/settings") or an asset URI
    ControlKind            Kind       = 5;
    FieldRange             Range      = 6;  // Number
    JsonValue              Default    = 7;  // the bottom layer
    FieldAccess            Access     = 8;
    string                 AccessNote = 9;  // why the value is read-only
    repeated ControlChoice Choices    = 10; // Choice
    repeated SettingLayer  Layers     = 11; // nearest first; empty = the menu's own store
    repeated ControlSpec   Children   = 12; // Menu, List
    ControlSpec            Template   = 13; // List: a new element's spec
    string                 StyleURI   = 14; // a look other than the kind's default, e.g. "cell/number.knob"
}

// Control is a ControlSpec beside a proto field.  Every option states its
// ValueID; an unset Kind takes the field's type.
extend google.protobuf.FieldOptions {
    ControlSpec Control = 50001;
}


// BodyEncoding is how an HTTP request body is encoded.
enum BodyEncoding {
    JSON = 0;  // application/json
    Form = 1;  // application/x-www-form-urlencoded
}

// LoginForm is the recipe for exchanging a username + password for a session
// token:  POST the credentials to an endpoint and read the minted token from
// the response.
//
// A LoginForm carries NO secrets — only the *shape* of that exchange (where to
// POST, how the body is encoded, and how the credential and token fields are
// named).
message LoginForm {
    BodyEncoding        Encoding     = 1;  // how the request body is encoded
    string              UserField    = 2;  // request field name for the username (default "username")
    string              PassField    = 3;  // request field name for the password (default "password")
    string              TokenPostURL = 6;  // POST endpoint that mints the token
    string              TokenField   = 8;  // response field holding the minted token (e.g. "token")
}


// Credentials is a user + secret pair a node holds for a provider (a premium
// stream login, a relay account; an API key is Secret alone).  It rides only
// sealed: the plaintext of the node.Credentials : sealed cell for that
// provider (ItemID = the provider name) on a confidential planet
// (amp.SealValueBox; the box's ContentType is amp.ProtoContentType of this
// message), never a plaintext attr.
message Credentials {
    string User   = 1;
    string Secret = 2;

    // The login URL (scheme://host[:port]/path) this secret may be posted to.
    // A holder that exchanges the pair for a token refuses any other endpoint.
    string Endpoint = 3;

    // The hosts a token derived from this pair may be presented to; a holder
    // presents it nowhere else.  Each entry is `host` or `host:port` and nothing
    // more: no scheme, path, userinfo or wildcard.  The host is a DNS name in
    // lower case — an IDN in its ASCII (punycode) form — or an IP literal: IPv6
    // in brackets and IPv4 bare, each in its canonical text (a host whose last
    // label is numeric is an IPv4 literal or refused).  A missing port is https's,
    // 443.  An entry that names a private or loopback address parses, and a holder
    // refuses it at dial: a token goes to public addresses alone.  Endpoint's host
    // is not implied: a token that goes there is listed here.  ParseTokenHosts is
    // the one parser; an entry it refuses, or a list over TokenHosts.DefaultMax
    // entries, refuses the record.
    repeated string TokenHosts = 4;
}
