syntax = "proto3";
package status;

option csharp_namespace = "art.media.platform.status";
option go_package = "github.com/art-media-platform/amp.SDK/stdlib/status";


// Code expresses status and error codes.  Nil (0) is success; every failure is
// negative.  Codes are grouped by what the CALLER does next — the class a
// client branches on (never on the message text):
//
//   transient — retry later, unchanged: the target is not there yet, is paused,
//               or is going away
//   refused   — the request as made cannot succeed; change the request
//   admission — the caller's identity or standing refuses it; authenticate, or
//               ask for standing
//   closed    — the handle, request, or session is gone; open a new one
//   failed    — the substrate could not complete a valid request; read the node
//   keys      — key and crypto material
//
// Values are wire-frozen (v0.260.0); a new code takes the next free value and
// is listed under its group.
enum Code {
    Nil                         = 0;        // success — no status to report

    // transient — retry later, unchanged
    Timeout                     = -23005;
    ShuttingDown                = -23006;
    NotConnected                = -23007;   // the endpoint does not answer: down, or wrong host/port
    NotReady                    = -23011;   // not yet materialized / attached
    Paused                      = -23018;   // the instrument is paused by its owner (an InvitePaused policy); retry after it resumes
    CapReached                  = -23019;   // a sizing cap refused this admission (PlanetInvitePolicy.MaxWebHomes); an operator raise or a drop re-opens it

    // refused — change the request
    Unimplemented               = -23004;   // no implementation in this build
    Expired                     = -23010;   // past its lifetime
    ItemNotFound                = -23013;
    ParseFailed                 = -23014;
    Gone                        = -23016;   // removed at its source; retry cannot succeed
    Unsupported                 = -23017;   // the endpoint answers but lacks the requested capability
    BadRequest                  = -23022;
    BadTag                      = -23023;   // malformed tag expression
    BadValue                    = -23024;
    AlreadyExists               = -23025;
    MalformedTx                 = -23032;   // TxMsg failed validation

    // admission — authenticate, or ask for standing
    AuthFailed                  = -23008;
    LoginFailed                 = -23009;
    InsufficientPermissions     = -23051;

    // closed — open a new handle
    Cancelled                   = -23012;
    Closed                      = -23015;   // handle or service closed; calls refused
    RequestClosed               = -23021;

    // failed — the substrate could not complete a valid request
    Unnamed                     = -23001;   // an uncoded cause; no specific code applies
    AssertFailed                = -23002;
    CommitFailed                = -23028;
    StorageFailure              = -23030;
    DataFailure                 = -23041;   // stored data unreadable
    ProviderErr                 = -23045;   // upstream provider failed

    // keys — key and crypto material
    DecryptFailed               = -23102;
    VerifySignatureFailed       = -23103;
    BadKeyFormat                = -23104;
    KeyGenerationFailed         = -23105;
    KeyringNotFound             = -23106;
    SigningFailed               = -23109;
}

// Severity expresses the severity of a status message for logging and alerting
// purposes.
enum Severity {
    Debug   = 0;
    Info    = 1;
    Warning = 2;
    Error   = 3;
}

// Status is a general purpose status message.
message Status {
    Code        Code     = 1; // numerical code
    Severity    Severity = 2; // which log to target
    int32       Level    = 3; // log level, 0 is highest priority
    string      Message  = 4; // human readable message, may be empty
    fixed64     TimeID_0 = 8; // time-based ID, for ordering and deduplication use - tag.NowID()
    fixed64     TimeID_1 = 9; // trailing part of TimeID.
}