syntax = "proto3";
package status;

option csharp_namespace = "art.media.platform.status";
option go_package = "github.com/art-media-platform/amp.SDK/stdlib/status";


// Code expresses status and error codes.  Nil (0) is success; every failure is
// negative.  Codes are grouped by what the CALLER does next — the class a
// client branches on (never on the message text):
//
//   transient — retry later, unchanged: the target is not there yet, is paused,
//               or is going away
//   refused   — the request as made cannot succeed; change the request
//   admission — the caller's identity or standing refuses it; authenticate, or
//               ask for standing
//   closed    — the handle, request, or session is gone; open a new one
//   failed    — the substrate could not complete a valid request; read the node
//   keys      — key and crypto material
//
// Each group owns one contiguous band; a new code takes the next free value
// in its group's band and is listed under its group:
//
//   transient  -23001 … -23019
//   refused    -23020 … -23039
//   admission  -23040 … -23059
//   closed     -23060 … -23079
//   failed     -23080 … -23099
//   keys       -23100 … -23119
enum Code {
    Nil                         = 0;        // success — no status to report

    // transient — retry later, unchanged
    Timeout                     = -23001;
    ShuttingDown                = -23002;
    NotConnected                = -23003;   // the endpoint does not answer: down, or wrong host/port
    NotReady                    = -23004;   // not yet materialized / attached
    Paused                      = -23005;   // the instrument is paused by its owner (an InvitePaused policy); retry after it resumes
    CapReached                  = -23006;   // a sizing cap refused this admission (PlanetInvitePolicy.MaxWebHomes); an operator raise or a drop re-opens it

    // refused — change the request
    Unimplemented               = -23020;   // no implementation in this build
    Expired                     = -23021;   // past its lifetime
    ItemNotFound                = -23022;
    ParseFailed                 = -23023;
    Gone                        = -23024;   // removed at its source; retry cannot succeed
    Unsupported                 = -23025;   // the endpoint answers but lacks the requested capability
    BadRequest                  = -23026;
    BadTag                      = -23027;   // malformed tag expression
    BadValue                    = -23028;
    AlreadyExists               = -23029;
    MalformedTx                 = -23030;   // TxMsg failed validation

    // admission — authenticate, or ask for standing
    AuthFailed                  = -23040;
    LoginFailed                 = -23041;
    InsufficientPermissions     = -23042;

    // closed — open a new handle
    Cancelled                   = -23060;
    Closed                      = -23061;   // handle or service closed; calls refused
    RequestClosed               = -23062;

    // failed — the substrate could not complete a valid request
    Unnamed                     = -23080;   // an uncoded cause; no specific code applies
    AssertFailed                = -23081;
    CommitFailed                = -23082;
    StorageFailure              = -23083;
    DataFailure                 = -23084;   // stored data unreadable
    ProviderErr                 = -23085;   // upstream provider failed

    // keys — key and crypto material
    DecryptFailed               = -23100;
    VerifySignatureFailed       = -23101;
    BadKeyFormat                = -23102;
    KeyGenerationFailed         = -23103;
    KeyringNotFound             = -23104;
    SigningFailed               = -23105;
}

// Severity expresses the severity of a status message for logging and alerting
// purposes.
enum Severity {
    Debug   = 0;
    Info    = 1;
    Warning = 2;
    Error   = 3;
}

// Status is a general purpose status message.
message Status {
    Code        Code     = 1; // numerical code
    Severity    Severity = 2; // which log to target
    int32       Level    = 3; // log level, 0 is highest priority
    string      Message  = 4; // human readable message, may be empty
    fixed64     TimeID_0 = 8; // time-based ID, for ordering and deduplication use - tag.NowID()
    fixed64     TimeID_1 = 9; // trailing part of TimeID.
}